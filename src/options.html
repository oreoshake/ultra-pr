<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ultra PR settings</title>
<style>
  :root { color-scheme: light dark; font: 14px/1.45 system-ui, -apple-system, sans-serif; }
  body { margin: 16px; min-width: 320px; max-width: 520px; }
  label { display: grid; grid-template-columns: auto 1fr; gap: 2px 10px; align-items: start; padding: 10px 0; cursor: pointer; }
  input { margin: 3px 0 0; width: 16px; height: 16px; }
  .name { font-weight: 600; }
  .help { grid-column: 2; opacity: 0.75; }
  #status { min-height: 1.45em; margin-top: 6px; opacity: 0.75; }
</style>
</head>
<body>
  <label>
    <input type="checkbox" id="splitView">
    <span class="name">Open pull requests in split view</span>
    <span class="help">Opening a pull request's Conversation or Files changed opens the other alongside. Links followed in one side update the other, and closing one side closes both.</span>
  </label>
  <label>
    <input type="checkbox" id="autoViewTests">
    <span class="name">Mark test files as viewed</span>
    <span class="help">On Files changed, check Viewed for every <code>.test.ts</code> file. Files you uncheck yourself are left alone.</span>
  </label>
  <div id="status" role="status"></div>
  <script type="module" src="options.js"></script>
</body>
</html>
